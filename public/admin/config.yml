# Decap CMS Configuration untuk Blog Bagas
# Dokumentasi: https://decapcms.org/docs/configuration-options/

# Backend configuration - menggunakan GitHub
backend:
  name: github
  repo: BagasHtml/Blog_Bagas  # Format: username/repo-name
  branch: main  # Branch yang akan di-commit
  base_url: https://api.netlify.com  # OAuth endpoint
  auth_endpoint: auth

# Publish mode
publish_mode: editorial_workflow  # Enable draft, review, dan ready states

# Media files configuration
media_folder: "src/assets"  # Folder untuk upload images
public_folder: "../../assets"  # Path yang digunakan dalam markdown

# Local backend untuk development (opsional)
# Uncomment ini untuk test local tanpa GitHub
# local_backend: true

# Collections - definisi content types
collections:
  # Blog Posts Collection
  - name: "blog"
    label: "Blog Posts"
    label_singular: "Blog Post"
    folder: "src/content/blog"
    create: true  # Allow creating new posts
    slug: "{{slug}}"  # Filename pattern
    extension: "md"
    format: "frontmatter"
    editor:
      preview: true
    
    # Fields - harus match dengan schema di content.config.ts
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
        hint: "Judul artikel/project"
        
      - label: "Description"
        name: "description"
        widget: "string"
        hint: "Deskripsi singkat artikel"
        
      - label: "Publish Date"
        name: "pubDate"
        widget: "datetime"
        format: "MMM DD YYYY"
        date_format: "MMM DD YYYY"
        time_format: false
        hint: "Tanggal publikasi artikel"
        
      - label: "Updated Date"
        name: "updatedDate"
        widget: "datetime"
        format: "MMM DD YYYY"
        date_format: "MMM DD YYYY"
        time_format: false
        required: false
        hint: "Tanggal update artikel (opsional)"
        
      - label: "Hero Image"
        name: "heroImage"
        widget: "image"
        required: false
        hint: "Gambar utama artikel (opsional)"
        media_library:
          config:
            multiple: false
        
      - label: "Body"
        name: "body"
        widget: "markdown"
        hint: "Konten artikel dalam format Markdown"
        buttons:
          - bold
          - italic
          - code
          - link
          - heading-two
          - heading-three
          - heading-four
          - quote
          - code-block
          - bulleted-list
          - numbered-list

    # Sortir berdasarkan tanggal terbaru
    sortable_fields: ['pubDate', 'title']
    view_filters:
      - label: "Drafts"
        field: "draft"
        pattern: true
    
    # Preview configuration
    summary: "{{title}} - {{pubDate}}"
